name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pushes to main / manual runs: unversioned dev build (0.1.0-dev.<run>+<sha>).
  dev:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
      - run: dotnet publish src/LogitechBattery -c Release -p:VersionSuffix=dev.${{ github.run_number }} -o out
      - uses: actions/upload-artifact@v7
        with:
          name: LogitechBattery-win-x64
          path: out/LogitechBattery.exe
          retention-days: 1

  # Tag pushes (vX.Y.Z): versioned build attached to a GitHub Release.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
      - run: dotnet publish src/LogitechBattery -c Release -p:Version=${GITHUB_REF_NAME#v} -o out
      - run: gh release create "$GITHUB_REF_NAME" out/LogitechBattery.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
