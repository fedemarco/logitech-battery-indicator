name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every run: the tests on Windows too, where file sharing, paths and line endings behave as on the user's PC.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
      - run: dotnet publish src/LogitechBattery.App -c Release -o out
      # The published exe, started with simulated readings, must keep running and log nothing but the start line and notifications.
      - name: Smoke test (the mock app must start, keep running and stay inside the memory limit)
        shell: pwsh
        env:
          # Memory gate: the budgets, the baseline and the reason are in CLAUDE.md ("Memory gate").
          MAX_PRIVATE_MB: 20
          MAX_THREADS: 20
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'LogitechBattery\log.txt'
          if (Test-Path $log) { throw "The tests wrote to the real log: $log" }
          Write-Host "Session $((Get-Process -Id $PID).SessionId), interactive $([Environment]::UserInteractive), explorer $([bool](Get-Process explorer -ErrorAction SilentlyContinue))"
          $settleSeconds = 30
          $start = Get-Date
          $app = Start-Process out\LogitechBattery.exe -ArgumentList '--mock' -PassThru
          Start-Sleep -Seconds $settleSeconds
          $running = -not $app.HasExited
          if ($running) {
              $app.Refresh()
              $privateMb = [math]::Round($app.PrivateMemorySize64 / 1MB, 1)
              $workingSetMb = [math]::Round($app.WorkingSet64 / 1MB, 1)
              $threads = $app.Threads.Count
              Write-Host "Memory after $settleSeconds s: private $privateMb MB (limit $env:MAX_PRIVATE_MB), working set $workingSetMb MB, threads $threads (limit $env:MAX_THREADS), handles $($app.HandleCount)"
              Stop-Process -Id $app.Id -Force
          }
          $lines = @(Get-Content $log -ErrorAction SilentlyContinue)
          $lines | Write-Host
          $crashes = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = $start } -ErrorAction SilentlyContinue |
              Where-Object Message -match 'LogitechBattery')
          if (-not $running) { throw "The app exited (exit code $($app.ExitCode))" }
          if ($privateMb -gt [double]$env:MAX_PRIVATE_MB) { throw "Memory gate: private bytes $privateMb MB are above the limit of $env:MAX_PRIVATE_MB MB" }
          if ($threads -gt [int]$env:MAX_THREADS) { throw "Memory gate: $threads threads are above the limit of $env:MAX_THREADS" }
          if ($crashes) { throw "Windows logged an error: $($crashes[0].Message)" }
          if ($lines.Count -eq 0 -or $lines[0] -notmatch '  Started LogitechBattery \S+ \(mock\)$') { throw 'No start line in the log' }
          $unexpected = @($lines | Select-Object -Skip 1 | Where-Object { $_ -notmatch '  Notification: ' })
          if ($unexpected) { throw "Unexpected log lines:`n$($unexpected -join "`n")" }

  # Pushes to main / manual runs: unversioned dev build (<VersionPrefix>-dev.<run>+<sha>).
  dev:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/LogitechBattery.App -c Release -p:VersionSuffix=dev.${{ github.run_number }} -o out
      - uses: actions/upload-artifact@v7
        with:
          name: LogitechBattery-win-x64
          path: out/LogitechBattery.exe
          retention-days: 1

  # Tag pushes (vX.Y.Z): versioned build attached to a GitHub Release.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: test-windows # never release a build whose tests fail on Windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check the tag matches VersionPrefix
        run: |
          prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          if [ "$prefix" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VersionPrefix $prefix in Directory.Build.props"
            exit 1
          fi
      - run: dotnet publish src/LogitechBattery.App -c Release -p:Version=${GITHUB_REF_NAME#v} -o out
      - run: gh release create "$GITHUB_REF_NAME" out/LogitechBattery.exe THIRD-PARTY-NOTICES.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
