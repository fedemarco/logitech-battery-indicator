name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every run: the tests on Windows too, where file sharing, paths and line endings behave as on the user's PC.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  # Pushes to main / manual runs: unversioned dev build (<VersionPrefix>-dev.<run>+<sha>).
  dev:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test
      - run: dotnet publish src/LogitechBattery.App -c Release -p:VersionSuffix=dev.${{ github.run_number }} -o out
      - uses: actions/upload-artifact@v7
        with:
          name: LogitechBattery-win-x64
          path: out/LogitechBattery.exe
          retention-days: 1

  # Tag pushes (vX.Y.Z): versioned build attached to a GitHub Release.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: test-windows # never release a build whose tests fail on Windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Check the tag matches VersionPrefix
        run: |
          prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          if [ "$prefix" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VersionPrefix $prefix in Directory.Build.props"
            exit 1
          fi
      - run: dotnet test
      - run: dotnet publish src/LogitechBattery.App -c Release -p:Version=${GITHUB_REF_NAME#v} -o out
      - run: gh release create "$GITHUB_REF_NAME" out/LogitechBattery.exe THIRD-PARTY-NOTICES.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
