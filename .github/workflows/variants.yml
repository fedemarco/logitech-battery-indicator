name: variants

# Temporary, started by hand: builds the exe with different packaging settings so that its memory use can be compared on Windows.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: V0 (as released)
        run: dotnet publish src/LogitechBattery.App -c Release -o out/V0
      - name: V3 (uncompressed, English only, invariant globalization)
        run: |
          rm -rf src/LogitechBattery.App/obj src/LogitechBattery.App/bin src/LogitechBattery.Core/obj src/LogitechBattery.Core/bin
          dotnet publish src/LogitechBattery.App -c Release -p:EnableCompressionInSingleFile=false -p:SatelliteResourceLanguages=en -p:InvariantGlobalization=true -o out/V3
      - run: ls -l out/V0/LogitechBattery.exe out/V3/LogitechBattery.exe
      - uses: actions/upload-artifact@v7
        with:
          name: LogitechBattery-variants
          path: |
            out/V0/LogitechBattery.exe
            out/V3/LogitechBattery.exe
          retention-days: 1
