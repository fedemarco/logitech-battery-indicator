name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Hover the tray icon, the last line shows the version. Or copy the last "Started LogitechBattery …" line from log.txt.
      placeholder: 0.5.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run winver, for example Windows 11 24H2.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      value: PRO X2 SUPERSTRIKE
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Lightspeed receiver
        - USB cable
        - Both
        - Other
    validations:
      required: true
  - type: checkboxes
    id: other-software
    attributes:
      label: Other Logitech software
      options:
        - label: G HUB is running
        - label: Logi Options+ is running
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: >-
        Drag log.txt here, and probe.txt or listen.txt if you made them (see Troubleshooting in the README).
        They are in %LOCALAPPDATA%\LogitechBattery.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I opened the files and removed anything private, for example my Windows user name.
          required: true
